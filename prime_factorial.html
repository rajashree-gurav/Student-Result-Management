<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prime & Factorial</title>
  <style>
    body { font-family: Arial; margin:20px; }
    h2 { text-align:center; color:#004080; }
    input { padding:8px; margin:10px; }
    button { background:#004080; color:white; padding:8px; border:none; cursor:pointer; }
    button:hover { background:#ff6600; }
    #output { margin-top:20px; text-align:center; font-weight:bold; }
  </style>
</head>
<body>
  <h2>Prime Number & Factorial</h2>
  <input type="number" id="num" placeholder="Enter a number">
  <button onclick="checkNumber()">Check</button>

  <div id="output"></div>

  <script>
    function checkNumber(){
      let n = parseInt(document.getElementById("num").value);
      if(isNaN(n) || n<0){
        alert("Please enter a positive number");
        return;
      }
      // Prime check
      let isPrime = true;
      if(n<=1) isPrime=false;
      for(let i=2;i<=Math.sqrt(n);i++){
        if(n%i===0){ isPrime=false; break; }
      }

      // Factorial
      let fact=1;
      for(let i=1;i<=n;i++){ fact*=i; }

      document.getElementById("output").innerHTML =
        "Number: "+n+"<br>Prime: "+(isPrime?"Yes":"No")+"<br>Factorial: "+fact;
    }
  </script>
</body>
</html>
